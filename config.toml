base_url = "https://eloop.org"
title = "eloop"
description = "eloop is the enterprise conference for hackers! Share experience, projects, or trauma and connect with like-minded people for maximum damage."
default_language = "en"
compile_sass = true
build_search_index = false
generate_feeds = false

[markdown]
smart_punctuation = true

[extra]
tagline = "Hackers in business conference"
# the edition the front page advertises
current_edition = "2026"
# the frame colour is picked at random from these on every page load
accents = ["#ff0", "#0ff", "#f0f"]
twitter = "eloop_congress"
irc = "irc.hackint.org / #eloop"

sponsors = [
  { name = "AfRA Berlin", url = "https://www.afra-berlin.de", description = "A cozy hackerspace in Berlin" },
  { name = "binaergewitter", url = "https://blog.binaergewitter.de/", description = "A podcast on web, technology and open source" },
  { name = "krebs", url = "https://krebsco.de/", description = "A group of hackers originating from Stuttgart" },
  { name = "shackspace", url = "https://shackspace.de/", description = "A large hackerspace in Stuttgart" },
  { name = "c-base", url = "https://c-base.org/", description = "A reconstructed space station under Berlin" },
  { name = "mathe.cafe", url = "https://mathe.cafe", description = "A social structure in the roof of the MA building of TU Berlin" },
]

